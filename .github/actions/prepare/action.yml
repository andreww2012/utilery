name: Prepare
description: Prepares CI environment

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '22'
  install-npm:
    description: Install a working npm
    required: false
    default: 'false'
  bun-version:
    description: >-
      Bun version to install, if any. `minimum` installs the lowest version that `engines.bun` in
      `package.json` allows
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Read pnpm version from package.json
      id: pnpm-version
      shell: bash
      run: echo "version=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_OUTPUT"
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        # TODO remove the explicit version after
        # https://github.com/pnpm/action-setup/issues/227 is fixed
        version: ${{ steps.pnpm-version.outputs.version }}
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        cache: pnpm
        node-version: ${{ inputs.node-version }}
        registry-url: https://registry.npmjs.org # Required for Trusted Publishing
    - name: Resolve Bun version
      id: bun-version
      if: inputs.bun-version != ''
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.bun-version }}
      # `setup-bun` can read `engines.bun` itself, but it resolves a range to the latest version.
      # The first version in the range is the lowest one in ranges like `>=1.4.0` and `^1.4.0`
      run: |
        if [ "$BUN_VERSION" = minimum ]; then
          BUN_VERSION=$(jq -r '.engines.bun' package.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
        fi
        echo "version=$BUN_VERSION" >> "$GITHUB_OUTPUT"
    - name: Setup Bun
      if: inputs.bun-version != ''
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.bun-version.outputs.version }}
    - name: Install dependencies
      shell: bash
      run: pnpm ci
    - name: Check deps for vulnerabilities & peer deps issues
      shell: bash
      run: pnpm check:deps
    - name: Install a working npm
      shell: bash
      if: inputs.install-npm == 'true'
      run: |
        # The npm bundled with the runner's Node.js may have missing internal
        # dependencies (e.g. `promise-retry`), making `npm install` itself crash.
        # Bootstrap by downloading the npm tarball directly and using that fresh
        # copy to perform the global install
        NPM_VERSION=$(curl -fsSL https://registry.npmjs.org/-/package/npm/dist-tags | jq -r '.latest')
        curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz" | tar -xzC /tmp/
        node /tmp/package/bin/npm-cli.js install --global "npm@${NPM_VERSION}"
