# cspell:ignore GHSA
# Makes Changesets name git tags `<package-name>@<version>` instead of `v<version>`
packages:
  - ./

catalogs:
  bundled:
    '@antfu/utils': 9.3.0
    '@braintree/sanitize-url': 7.1.2
    '@sindresorhus/slugify': 4.0.1
    '@sindresorhus/transliterate': 3.0.0
    '@thi.ng/binary': 3.6.17
    '@tusbar/cache-control': 3.0.1
    any-ascii: 0.3.3
    arkregex: 0.0.14
    clickable-path: 0.1.1
    cross-spawn: 7.0.6
    decode-uri-component: 0.5.1
    dedent: 1.7.2
    destr: 2.0.5
    devalue: 6.0.3
    env-paths: 4.0.0
    es-toolkit: 1.53.0
    find-up-simple: 1.0.1
    htmlescape: 1.1.1
    http-link-header: 1.1.4
    ipaddr.js: 2.5.0
    leven: 4.1.0
    lossless-json: 4.3.3
    ms-ts: 1.2.0
    nanoid: 6.0.2
    negotiator: 1.1.0
    neotraverse: 1.0.1
    p-memoize: 9.0.0
    parse-package-name: 1.0.0
    path-type: 6.0.0
    picomatch: 4.0.7
    pretty-bytes: 7.2.0
    pretty-ms: 10.0.0
    puka: 1.0.1
    range-parser: 1.3.0
    remeda: 2.55.0
    safe-stable-stringify: 3.0.0
    split-string: 6.1.0
    string-ts: 2.3.1
    string-width: 9.0.0
    strip-ansi: 7.2.0
    toposort: 2.0.2
    ts-extras: 1.3.0
    type-fest: 5.10.0
    typed-query-selector: 2.12.3
    uint8array-extras: 1.6.0
    verkit: 0.5.0
    which: 7.0.0
    wrap-ansi: 10.0.2
    write-json-file: 7.0.0
    yieldable-json: 2.1.0
    yn: 5.1.0
  default:
    '@andreww2012/commitlint-config': 0.1.0
    '@andreww2012/npm-check-updates-config': 0.1.1
    '@antfu/ni': 30.6.0
    '@arethetypeswrong/core': 0.18.5
    '@changesets/changelog-github': 1.0.1
    '@changesets/cli': 3.0.3
    '@commitlint/cli': 21.2.4
    '@eslint/config-inspector': 3.5.0
    '@types/htmlescape': 1.1.3
    '@types/http-link-header': 1.0.7
    '@types/negotiator': 0.6.5
    '@types/node': 22.20.5
    '@types/picomatch': 4.0.3
    '@types/range-parser': 1.2.7
    '@types/toposort': 2.0.7
    '@types/which': 3.0.4
    '@types/yieldable-json': 2.0.2
    '@typescript-eslint/eslint-plugin': 8.72.2
    '@vitest/coverage-v8': 5.1.0
    '@vitest/eslint-plugin': 1.6.28
    '@vitest/ui': 5.1.0
    actions-up: 2.0.0
    all-contributors-cli: 7.0.0
    cleye: 2.7.0
    cross-env: 10.1.0
    cspell: 10.4.0
    eslint: 10.14.0
    eslint-config-un: 1.0.0-rc.7
    eslint-plugin-github-action: 0.5.0
    eslint-plugin-perfectionist: 5.13.0
    eslint-plugin-remeda: 2.2.0
    eslint-plugin-sentences-per-line: 0.1.6
    eslint-plugin-sonarjs: 4.2.2
    eslint-plugin-valibot: ^1.5.0
    happy-dom: 21.0.4
    jest-extended: 7.0.0
    knip: 6.44.1
    lefthook: 2.2.2
    npm-check-updates: 23.1.1
    oxfmt: 0.77.0
    publint: 0.3.25
    rolldown: 1.3.0
    tsdown: 0.23.7
    typescript: 'npm:@typescript/typescript6@6.0.2'
    typescript7: 'npm:typescript@7.0.2'
    valibot: 1.5.0
    vitest: 5.1.0

saveExact: true
autoDedupe: true
saveTypes: true
lockfile:
  # Records `autoDedupe`, so that installs don't resolve the lockfile again
  includeResolutionSettings: true

minimumReleaseAge: 960 # 16 hours in minutes
# Auto-adds too-new versions to the exclude list instead of prompting or failing
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude:
  # []
  - tsdown@0.23.7
  - '@oxfmt/binding-android-arm-eabi@0.77.0'
  - '@oxfmt/binding-android-arm64@0.77.0'
  - '@oxfmt/binding-darwin-arm64@0.77.0'
  - '@oxfmt/binding-darwin-x64@0.77.0'
  - '@oxfmt/binding-freebsd-x64@0.77.0'
  - '@oxfmt/binding-linux-arm-gnueabihf@0.77.0'
  - '@oxfmt/binding-linux-arm-musleabihf@0.77.0'
  - '@oxfmt/binding-linux-arm64-gnu@0.77.0'
  - '@oxfmt/binding-linux-arm64-musl@0.77.0'
  - '@oxfmt/binding-linux-ppc64-gnu@0.77.0'
  - '@oxfmt/binding-linux-riscv64-gnu@0.77.0'
  - '@oxfmt/binding-linux-riscv64-musl@0.77.0'
  - '@oxfmt/binding-linux-s390x-gnu@0.77.0'
  - '@oxfmt/binding-linux-x64-gnu@0.77.0'
  - '@oxfmt/binding-linux-x64-musl@0.77.0'
  - '@oxfmt/binding-openharmony-arm64@0.77.0'
  - '@oxfmt/binding-win32-arm64-msvc@0.77.0'
  - '@oxfmt/binding-win32-ia32-msvc@0.77.0'
  - '@oxfmt/binding-win32-x64-msvc@0.77.0'
  - oxfmt@0.77.0
  - rolldown-plugin-dts@0.30.0
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude: # []
  - lefthook@2.2.2

audit:
  ignore: # []
    # `http-cache-semantics` from `eslint-config-un` has no patched version yet
    - GHSA-ch52-4w7c-c8xp
  ignorePrune: true

allowBuilds:
  lefthook@2.2.2: true

  esbuild: false
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false

overrides:
  # Bundles one copy of `which` (and `isexe`): `cross-spawn` only calls `which.sync`, which is the
  # same in v2 and v7
  cross-spawn>which: 'catalog:bundled'
  # Bundles one copy of `string-width`: `wrap-ansi` only calls its default export, which takes the
  # same arguments in v8 and v9
  wrap-ansi@10>string-width: 'catalog:bundled'
  # The `typescript7` alias pulls the real `typescript@7` that does not expose the API yet
  eslint-plugin-sonarjs>typescript: 'catalog:'
  # cspell:disable-next-line
  # GHSA-fx2h-pf6j-xcff
  nanoid@>=3 <3.3.17: 3.3.18
  postcss@>=8 <=8.5.17: 8.5.26

peerDependencyRules:
  allowedVersions:
    eslint-config-un@1.0.0-rc.7>eslint-plugin-github-action: '>=0.5.0 && < 1'

# Explicit version should be added <=> multiple package versions are present in the dep tree
patchedDependencies:
  '@sindresorhus/slugify': patches/@sindresorhus__slugify.patch
  '@sindresorhus/transliterate': patches/@sindresorhus__transliterate.patch
  arkregex: patches/arkregex.patch
  decode-uri-component: patches/decode-uri-component.patch
  es-toolkit: patches/es-toolkit.patch
  http-link-header: patches/http-link-header.patch
  ipaddr.js: patches/ipaddr.js.patch
  lossless-json: patches/lossless-json.patch
  nanoid@6: patches/nanoid.patch
  remeda: patches/remeda.patch
  safe-stable-stringify: patches/safe-stable-stringify.patch
  signal-exit: patches/signal-exit.patch
  string-ts: patches/string-ts.patch
  string-width@9: patches/string-width.patch
  which@7: patches/which.patch
  wrap-ansi@10: patches/wrap-ansi.patch
  write-file-atomic@6: patches/write-file-atomic.patch
  yieldable-json: patches/yieldable-json.patch
