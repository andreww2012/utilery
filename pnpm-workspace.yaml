# cspell:ignore GHSA
# Makes Changesets name git tags `<package-name>@<version>` instead of `v<version>`
packages:
  - ./

saveExact: true
autoDedupe: true
saveTypes: true
lockfile:
  # Records `autoDedupe`, so that installs don't resolve the lockfile again
  includeResolutionSettings: true

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeExclude: []
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude: # []
  - lefthook@2.2.2

audit:
  ignore: # []
    - GHSA-ch52-4w7c-c8xp # `http-cache-semantics` from `eslint-config-un` has no patched version yet
  ignorePrune: true

allowBuilds:
  lefthook@2.2.2: true

  esbuild: false
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false

overrides:
  # The `typescript7` alias pulls the real `typescript@7` that does not expose the API yet
  eslint-plugin-sonarjs>typescript: 'npm:@typescript/typescript6@6.0.2'
  # GHSA-fx2h-pf6j-xcff cspell:disable-line
  nanoid@>=3 <3.3.17: 3.3.18
  postcss@>=8 <=8.5.17: 8.5.26

peerDependencyRules: {}

patchedDependencies:
  '@sindresorhus/slugify': patches/@sindresorhus__slugify.patch
  arkregex: patches/arkregex.patch
  ipaddr.js: patches/ipaddr.js.patch
  # Must include a version since multiple nanoid versions are present in the dep tree
  nanoid@6: patches/nanoid.patch
  remeda: patches/remeda.patch
  safe-stable-stringify: patches/safe-stable-stringify.patch
  signal-exit: patches/signal-exit.patch
  # Must include a version since multiple which versions are present in the dep tree
  which@7: patches/which.patch
  # Must include a version since multiple write-file-atomic versions are present in the dep tree
  write-file-atomic@6: patches/write-file-atomic.patch
  yieldable-json: patches/yieldable-json.patch
